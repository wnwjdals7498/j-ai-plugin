name: docdb

on:
  push:
    branches: [feat/docdb]
    paths: ["docdb/**", ".github/workflows/docdb.yml"]
  pull_request:
    paths: ["docdb/**", ".github/workflows/docdb.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: docdb
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Create dev venv and install pinned dependencies
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          "$PY" -m pip install -c constraints-dev.txt pytest pysqlite3 mcp
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: pytest
        run: '"$PY" -m pytest -q'
