[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-mgmt-tool"
version = "0.4.1"
description = "Local SQLite project memory and agent lifecycle integration"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
host = ["fastapi", "pydantic>=2", "uvicorn"]
host-test = ["cryptography"]

[project.scripts]
pmt = "pmt.cli:main"
pmt-host = "pmt.host.cli:main"
pmt-server = "pmt.server_admin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pmt-test/pytest-temp"
